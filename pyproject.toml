[project]
name = "goon"
version = "0.1.0"
description = "AI concierge via SMS and phone calls"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "aiofiles>=24.1",
    "aiosqlite>=0.20",
    "anthropic>=0.43",
    "httpx>=0.28",
    "twilio>=9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goon"
version = "0.1.0"
description = "Your AI that does the thing so you don't have to."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiosqlite>=0.21",
    "aiofiles>=24.1",
    "anthropic>=0.49",
    "twilio>=9.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.7",
    "stripe>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 99
